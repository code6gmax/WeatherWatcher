services:
  # 1. The API (FastAPI)
  - type: web
    name: weather-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && ./start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: weather-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: weather-redis
          property: connectionString

  # 2. The Worker (Celery + Beat)
  - type: worker
    name: weather-worker
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && celery -A tasks worker --beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: weather-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: weather-redis
          property: connectionString

  # 3. The Broker (Redis)
  - type: redis
    name: weather-redis
    plan: free
    ipAllowList: [] # Only internal services can connect

databases:
  # 4. The Database (Postgres)
  - name: weather-db
    plan: free
    databaseName: weather
    user: weather_user
