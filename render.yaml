services:
  # The "Monolith" Service (API + Worker combined)
  - type: web
    name: weather-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && chmod +x start.sh && ./start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: weather-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: weather-redis
          property: connectionString

  # The Broker (Redis)
  - type: redis
    name: weather-redis
    plan: free
    ipAllowList: [] 

databases:
  # The Database (Postgres)
  - name: weather-db
    plan: free
    databaseName: weather
    user: weather_user
